<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Otso Guardian</title>
    <style>

        :root{
            --login-with-width: 200px;
            --color: rgb(220, 220, 220);
            --background-color: #1c1b22;
        }

        body{
            background-color: var(--background-color);
            color: var(--color);
        }
        card{
            --size: 2.5;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: absolute;
            border: 1px var(--color) solid;
            padding: 0.5rem;
            bottom: 50%;
            right: 50%;
            translate: 50% 50%;
            transform: scale(var(--size));
        }

        .log-in-with{
            background-color: #010409;
            color: #f0f6fc;
            padding-left: 15px;
            padding-right: 15px;
            width: var(--login-with-width);
            height: 32px;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            border-radius: 7px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }
        .log-in-with:hover{
            transform: scale(1.05);
            box-shadow: 5px 5px 5px black;
        }
        .google-text{
            background-image: linear-gradient(to right,red, yellow, green, blue);
            color: transparent;
            background-clip: text;
        }

    </style>
</head>

    <script>
        const query = new URL(window.location).searchParams;
        const state = query.get("state");
        if(state){
            for(let array = document.querySelectorAll("a"), i = 0; i<array.length; i++){
                console.log(array[i]);
                const linkTo = array[i].attributes.href.nodeValue;
                if(!linkTo.startsWith("/oauth/")){
                    continue;
                }
                array[i].attributes.href.nodeValue += `?state=${state}`;
            }
        }
    </script>
