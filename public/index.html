<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Otso Guardian</title>
    <style>

        :root{
            --login-with-width: 185px;
        }
        
        body{
            background-color: #1c1b22;
            color: rgb(220, 220, 220);
        }

        .log-in-with{
            background-color: #010409;
            color: #f0f6fc;
            padding-left: 15px;
            padding-right: 15px;
            width: var(--login-with-width);
            height: 32px;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            border-radius: 7px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }
        .log-in-with:hover{
            transform: scale(1.05);
            box-shadow: 5px 5px 5px black;
        }

        .log-in-with-github{
            background-color: #010409;
            color: #f0f6fc;
            padding-left: 15px;
            padding-right: 15px;
            width: var(--login-with-width);

            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            border-radius: 7px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }
        .log-in-with-github:hover{
            transform: scale(1.05);
            box-shadow: 5px 5px 5px black;
        }

        .log-in-with-google{
            background-color: #ffffff;
            color: #1f1f1f;
            padding-left: 15px;
            padding-right: 15px;
            width: var(--login-with-width);
            height: 32px;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            border-radius: 7px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }
        .log-in-with-google:hover{
            transform: scale(1.05);
            box-shadow: 5px 5px 5px black;
        }

        
    </style>
</head>
