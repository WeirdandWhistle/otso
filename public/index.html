<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Otso Guardian</title>
    <style>

        :root{
            --login-with-width: 200px;
            --color: rgb(220, 220, 220);
            --background-color: #1c1b22;
        }

        body{
            background-color: var(--background-color);
            color: var(--color);
        }
				::backdrop{
					background-color: #00000088;
				}
    </style>
</head>
<body>

		<<h1>This is index.html</h1>

		<button command="show-modal" commandfor="modal">Open seasme</button>
		<dialog id="modal" closedby="any" style="background-color: var(--background-color); color: var(--color); width: 80%; padding: 1rem;">
			<p>This was opened without js?!?!</p>
			<button command="close" commandfor="modal">Close</button>
		</dialog>



		<script>
        const query = new URL(window.location).searchParams;
        const state = query.get("state");
        if(state){
            for(let array = document.querySelectorAll("a"), i = 0; i<array.length; i++){
                console.log(array[i]);
                const linkTo = array[i].attributes.href.nodeValue;
                if(!linkTo.startsWith("/oauth/")){
                    continue;
                }
                array[i].attributes.href.nodeValue += `?state=${state}`;
            }
        }
    </script>
</body>
</html>
