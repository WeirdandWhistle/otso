<!DOCTYPE html>
<html lang="en">

        :root{
            --login-with-width: 200px;

        body{
            background-color: var(--background-color);

<body>

		<h1>This is index.html</h1>

		<button command="show-modal" commandfor="modal">Open seasme</button>
		<dialog id="modal" closedby="any" style="background-color: var(--background-color); color: var(--color); width: 80%; padding: 1rem;">

		yay!

		<script>
				const input = document.getElementById("abc");

				input.addEventListener('mouseover',(e)=>{
					const rect = e.target.getBoundingClientRect();
					//console.log(window.scrollY);

					e.target.insertAdjacentHTML('afterend',`
						<div id="copymeplease" style="color:blue; position: absolute; top: ${rect.y + window.scrollY}px; left: ${rect.x}px;">Copy?</div>
						`);
				});
				input.addEventListener('mouseout',(e)=>{
					document.getElementById('copymeplease').remove();
				});

        const query = new URL(window.location).searchParams;
        const state = query.get("state");
        if(state){
            for(let array = document.querySelectorAll("a"), i = 0; i<array.length; i++){
                console.log(array[i]);
                const linkTo = array[i].attributes.href.nodeValue;
                if(!linkTo.startsWith("/oauth/")){
                    continue;
                }
                array[i].attributes.href.nodeValue += `?state=${state}`;
            }
        }
    </script>
</body>
</html>
