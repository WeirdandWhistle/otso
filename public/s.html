<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/stylesheet.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .card{
            border: 1px var(--color) solid;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            gap: 0.2rem;
            width: 50rem;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
        }
    </style>
    <title>Sign-in Page | Otso</title>
</head>
<body>
    
    <div id="deleteMe" style="display: none; justify-content: center; align-items: center; flex-direction: column;">
        <h1>Thank you for choosing <b>Otso</b>.</h1>
        <p>Please wait while your request is being processed.</p>
    </div>

    <div class="card" style="display: none;" id="main">
        <h1 id="tokenexpired" style="display: none;">Your sign-in link has expired.</h1>
        <div id="approve-login-div" style="display: none; flex-direction: column; width: 100%; align-items: center;">
            <h2>Approve log-in request?</h2>
            <hr style="width: 90%; color: var(--color);">
            <p>You are currently logged in as <b id="fill-username">_____</b>.</p>
            <p>Someone is trying to log-in to your account from:<br>
            <div><pre>ip     :</pre><input id="fill-ip"></div>
            <div><pre>Browser:</pre><input id="fill-browser"></div>
            <div><pre>OS     :</pre><input id="fill-os"></div>
            <p>Is this you?</p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <div onclick="approveLoginRequest()" class="yes-no-div" style="background-color: var(--active-green)">Yes</div>
                <div onclick="denyLoginRequest()" class="yes-no-div" style="background-color: var(--active-red)">No</div>
            </div>
        </div>
    </div>
    <h1 style="display: none;" id="nope"></h1>

    <script>
        const url = new URL(window.location);
        function process(){
            document.getElementById('deleteMe').style.display = 'none';
            document.getElementById('main').style.display = 'flex';
        }
        async function a() {
            const token = url.searchParams.get('t');
            if(!token) {
                nope('token is null');
                return;
            }
            const res = await fetch('/api/links/getsession/'+token,{
                headers:{
                    'CSRFTokenNL' : await getCSRFTokenNL(),
                }
            });
            process();
            if(res.status == 401){
                document.getElementById('tokenexpired').style.display = 'block';
                return;
            }
            if(!res.ok){
                doError(res);
                return;
            }
            window.location = '/account';
        }
        let big_t_token;
        async function b() {
            const token = url.searchParams.get('t');
            if(!token) {
                nope('token is null');
                return;
            }
            let res = await fetch("/api/links/metadata/"+token,{
                headers:{
                    'CSRFToken': await getCSRFToken(),
                }
            });
            if(!res.ok) doError(res);
            process();
            const info = await res.json();
            document.getElementById('approve-login-div').style.display = 'flex';
            document.getElementById('fill-ip').value = info.ip;
            document.getElementById('fill-os').value = info.os;
            document.getElementById('fill-browser').value = info.browser;
            document.getElementById('fill-username').innerText = info.username;
            big_t_token = token;            
        }
        async function approveLoginRequest(){
            nope("Thank you... You can close this window now.");
            fetch("/api/links/approve/"+big_t_token,{
                headers:{
                    'CSRFToken': await getCSRFToken(),
                }
            });
        }
        async function denyLoginRequest(){
            nope("Thank you... You can close this window now.");
            fetch("/api/links/deny/"+big_t_token,{
                headers:{
                    'CSRFToken': await getCSRFToken(),
                }
            });
        }
        async function init() {
            switch(url.searchParams.get('v')){
                case 'a':
                    await a();
                    break;
                case 'b':
                    await b();
                    break;
                case 'debug':
                    break;
                default:
                    notAType();
                    break;
            }
        }
        init();
        function nope(error){
            document.getElementById('nope').style.display = 'block';
            document.getElementById('nope').innerText = error;
            document.getElementById('deleteMe').style.display = 'none';
            document.getElementById('main').style.display = 'none';
        }
        function notAType(){
            nope('Sorry we cant process your request. Because the "v" is invalid.');
        }


        async function getCSRFTokenNL(){
		    const res = await fetch("/api/CSRFTokenNL",{
		    	method: 'PUT',
		    });
		    if(!res.ok){
		    	doError(res);
		    	console.log("CSRF error: ", await res.text());			
		    	return;
		    }
		    return await res.text();
	    }
        async function getCSRFToken(){
		    const res = await fetch("/api/CSRFToken",{
		    	method: 'PUT',
		    });
		    if(!res.ok){
		    	doError(res);
		    	console.log("CSRF error: ", await res.text());
		    	if(res.status == 401)
		    		window.location = '/login';
            
		    	return;
		    }
		    return await res.text();
	    }
        const doError = async (res) => {
            if(res.ok) return;
			document.open();
			document.write(await res.text());
			document.close();
		throw new Error("block all feature code.")
	    }
    </script>
</body>
</html>
